<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#dff1f7"><title>윤아 사진첩</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen picture book — year tabs on top, one huge swipeable photo card, speech bubble pops from the bottom. Single warm theme by choice (toddler app). */
:root{
  color-scheme: light;
  --sky:#dff1f7;        /* page ground: soft morning sky */
  --ink:#2b2440;        /* text */
  --sun:#ffc93c;        /* active tab, highlights */
  --berry:#ff6f91;      /* accent: play ring, keyword chips */
  --leaf:#3fb68b;       /* grandma mode / save */
  --paper:#ffffff;      /* card + bubble */
  --muted:#6b6584;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-inline:16px;box-sizing:border-box;max-width:720px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex:none}
.tabs{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);font-size:1.25rem;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:6px 14px;flex:none;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.tab[aria-selected="true"]{background:var(--sun);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tab:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.gm{font-family:var(--body);font-size:.8rem;color:var(--muted);background:none;border:1px dashed var(--muted);border-radius:10px;padding:6px 8px;flex:none;cursor:pointer}
.gm.on{color:var(--paper);background:var(--leaf);border:1px solid var(--leaf)}

/* stage */
.stage{position:relative;flex:1;min-height:0}
.track{height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:28px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:4px}
.card{position:relative;height:100%;width:100%;background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);
  overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card img{width:100%;height:100%;object-fit:contain;max-width:100%;background:var(--paper)}
.card.playing{animation:wiggle .5s ease}
.card.playing::after{content:"";position:absolute;inset:0;border:6px solid var(--berry);border-radius:24px;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg) scale(1.01)}75%{transform:rotate(1.5deg) scale(1.01)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.age{position:absolute;left:12px;top:12px;font-family:var(--display);font-size:1.05rem;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:3px 10px}
.mic{position:absolute;right:12px;top:12px;font-family:var(--display);font-size:.9rem;background:var(--leaf);color:var(--paper);border-radius:10px;padding:3px 8px}
.tap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:1.05rem;background:rgba(43,36,64,.72);color:var(--paper);border-radius:999px;padding:6px 16px;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);
  font-family:var(--display);font-size:1.6rem;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;opacity:.92}
.nav.prev{left:-6px}.nav.next{right:-6px}
.nav[disabled]{opacity:.25}

/* bottom: counter + bubble */
.foot{flex:none;display:flex;flex-direction:column;gap:8px}
.counter{font-family:var(--display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:1rem}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-family:var(--display);font-size:1.3rem;line-height:1.45;
  min-height:3.2em;box-shadow:0 4px 0 var(--ink);transform-origin:50% 0;text-wrap:pretty}
.bubble::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.bubble.long{font-size:1.08rem;line-height:1.4}
.bubble .hint{color:var(--muted);font-size:1.05rem}
.kw{background:var(--sun);border-radius:8px;padding:0 4px;white-space:nowrap}
.who{display:block;font-family:var(--body);font-size:.85rem;color:var(--berry);margin-bottom:2px}

/* grandma tools */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--body);font-size:.95rem;font-weight:700;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer}
.btn.rec{background:var(--berry);color:var(--paper);border-color:var(--berry)}
.btn.save{background:var(--leaf);color:var(--paper);border-color:var(--leaf)}
.btn[disabled]{opacity:.45}
.edit{width:100%;box-sizing:border-box;font-family:var(--display);font-size:1.1rem;border:2px solid var(--ink);border-radius:12px;padding:8px;min-height:4.5em;background:var(--paper);color:var(--ink)}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
@media (max-height:640px){.bubble{font-size:1.1rem}.tab{font-size:1.1rem;padding:4px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>#gm,#tools{display:none!important}</style>

<div class="app">
  <div class="top">
    <div class="tabs" id="tabs" role="tablist" aria-label="연도"></div>
    <button class="gm" id="gm" type="button" title="꾹 눌러서 할머니 모드">할머니</button>
  </div>
  <div class="stage">
    <div class="track" id="track" aria-live="off"></div>
    <button class="nav prev" id="prev" type="button" aria-label="이전 사진">‹</button>
    <button class="nav next" id="next" type="button" aria-label="다음 사진">›</button>
  </div>
  <div class="foot">
    <div class="counter" id="counter"></div>
    <div class="bubble" id="bubble" aria-live="polite"><span class="hint">사진을 콕! 누르면 할머니가 말해 줘요</span></div>
    <div id="tools" hidden>
      <div class="tools">
        <button class="btn rec" id="recBtn" type="button">● 녹음하기</button>
        <button class="btn" id="fileBtn" type="button">음성 파일 넣기</button>
        <button class="btn" id="bulkBtn" type="button">녹음 한꺼번에 넣기</button>
        <button class="btn" id="editBtn" type="button">자막 고치기</button>
        <button class="btn" id="delBtn" type="button">녹음 지우기</button>
      </div>
      <div id="editWrap" hidden style="margin-top:8px;display:grid;gap:6px">
        <textarea class="edit" id="editTxt" aria-label="자막"></textarea>
        <div class="tools"><button class="btn save" id="editSave" type="button">자막 저장</button><button class="btn" id="editCancel" type="button">취소</button></div>
      </div>
      <input type="file" id="fileIn" accept="audio/*" capture hidden>
      <input type="file" id="bulkIn" accept="audio/*,.zip,.mp3,.m4a,.wav" multiple hidden>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script id="album" type="application/json">[{"id": "p001", "image": "p001.jpg", "date": "2023-01-01", "group": "뱃속", "age": "엄마 뱃속", "caption": "윤아야, 이건 엄마 뱃속에 있던 윤아야. 콩알만 한 사진인데도 할머니는 보고 또 보고, 백 번은 봤단다. 그때부터 할머니 마음은 벌써 두근두근 했어.", "w": 1180, "h": 1280}, {"id": "p002", "image": "p002.jpg", "date": "2023-02-05", "group": "뱃속", "age": "엄마 뱃속", "caption": "엄마 배가 이렇게 동그랗지? 그 안에 우리 윤아가 쏙 들어 있었어. 아빠가 든 작은 옷 보이니? 할머니는 이 사진 보면서 '빨리 만나고 싶다' 하고 매일 손꼽아 기다렸단다.", "w": 1280, "h": 853}, {"id": "p003", "image": "p003.jpg", "date": "2023-03-28", "group": "2023", "age": "태어난 지 2일", "caption": "짜잔! 윤아가 세상에 처음 나온 날이야. 앙앙 우는 소리가 얼마나 우렁찬지, 할머니는 '아이고, 우리 집에 가수가 태어났네!' 하고 눈물이 핑 돌았어. 세상에서 제일 예쁜 아기였단다.", "w": 633, "h": 1018}, {"id": "p004", "image": "p004.jpg", "date": "2023-03-30", "group": "2023", "age": "태어난 지 4일", "caption": "하~암! 태어난 지 나흘 된 윤아가 하품을 해. 하품 한 번 했을 뿐인데 할머니 마음이 아이스크림처럼 사르르 녹아 버렸지 뭐야.", "w": 1280, "h": 960}, {"id": "p005", "image": "p005.jpg", "date": "2023-04-01", "group": "2023", "age": "태어난 지 6일", "caption": "어머, 윤아 눈 좀 봐! 오! 하고 세상을 구경하네. 할머니는 이 눈빛 보고 알았어. '우리 윤아는 궁금한 게 많은 천재 아기구나!'", "w": 1280, "h": 960}, {"id": "p006", "image": "p006.jpg", "date": "2023-04-04", "group": "2023", "age": "태어난 지 9일", "caption": "쿨쿨, 새근새근. 자는 얼굴이 꼭 하얀 찹쌀떡 같아. 할머니는 깨울까 봐 숨도 살금살금 쉬었단다. 말랑말랑 귀여운 우리 윤아!", "w": 1280, "h": 960}, {"id": "p007", "image": "p007.jpg", "date": "2023-04-05", "group": "2023", "age": "태어난 지 10일", "caption": "앙! 윤아가 입을 크게 벌렸어. 노래를 부르는 걸까, 배가 고픈 걸까? 할머니 귀에는 '할머니 보고 싶어요~' 하는 소리로 들렸단다.", "w": 960, "h": 1280}, {"id": "p008", "image": "p008.jpg", "date": "2023-04-09", "group": "2023", "age": "태어난 지 14일", "caption": "짠! 피겨 여왕 윤아 선수 등장! 빙글빙글 돌아서 금메달을 땄어요. 할머니는 관중석에서 박수를 짝짝짝, 목이 쉬도록 응원했단다. 우리 윤아 최고!", "w": 780, "h": 837}, {"id": "p009", "image": "p009.jpg", "date": "2023-04-10", "group": "2023", "age": "태어난 지 15일", "caption": "빨간 사과 이불 덮고 앙앙! 그런데 이상하다? 사과보다 윤아 볼이 더 빨갛고 예뻐. 할머니는 사과 대신 윤아 볼에 뽀뽀하고 싶었어.", "w": 960, "h": 1280}, {"id": "p010", "image": "p010.jpg", "date": "2023-04-16", "group": "2023", "age": "태어난 지 21일", "caption": "사진이 여섯 장, 표정도 여섯 가지! 할머니한테 제일 예쁜 걸 고르라고 하면? 못 골라, 못 골라! 다 일등이야. 윤아는 표정 부자란다.", "w": 1280, "h": 1280}, {"id": "p011", "image": "p011.jpg", "date": "2023-04-16", "group": "2023", "age": "태어난 지 21일", "caption": "이 똘망똘망한 눈 좀 봐! 할머니가 무슨 생각 하는지 다 알고 있는 것 같지? 할머니는 이 눈빛에 반해서 하루 종일 사진만 들여다봤단다.", "w": 960, "h": 1280}, {"id": "p012", "image": "p012.jpg", "date": "2023-04-22", "group": "2023", "age": "태어난 지 27일", "caption": "할아버지랑 윤아랑 눈싸움 중! 누가 이겼을까? 할아버지가 너무 좋아서 먼저 웃어 버렸대. 할머니는 옆에서 보면서 깔깔 웃었지.", "w": 960, "h": 1280}, {"id": "p013", "image": "p013.jpg", "date": "2023-04-22", "group": "2023", "age": "태어난 지 27일", "caption": "히히! 윤아가 처음으로 방긋 웃었어. 이 미소 한 방에 할머니 집 전구가 다 반짝 켜졌단다. 할머니 마음도 반짝반짝 환해졌어.", "w": 960, "h": 1280}, {"id": "p014", "image": "p014.jpg", "date": "2023-04-25", "group": "2023", "age": "태어난 지 30일", "caption": "태어난 지 30일! 노란 옷 입고 토끼 친구랑 나란히 누웠네. 토끼가 윤아한테 귓속말을 했대. '너 정말 예쁘다!' 할머니도 똑같이 말하고 싶었어.", "w": 951, "h": 1252}, {"id": "p015", "image": "p015.jpg", "date": "2023-04-29", "group": "2023", "age": "태어난 지 34일", "caption": "윤아야, 어딜 그렇게 쳐다봐? 아, 할머니가 너무 예뻐서? 호호, 농담이야. 우리 윤아가 백 배 천 배 더 예뻐!", "w": 1013, "h": 1280}, {"id": "p016", "image": "p016.jpg", "date": "2023-04-29", "group": "2023", "age": "태어난 지 34일", "caption": "할아버지 팔에 폭 안겨서 쿨쿨. 할아버지 팔은 세상에서 제일 푹신한 침대래. 할머니는 그 모습이 너무 평화로워서 사진을 찰칵 찍었단다.", "w": 960, "h": 1280}, {"id": "p017", "image": "p017.jpg", "date": "2023-05-02", "group": "2023", "age": "태어난 지 37일", "caption": "동그란 눈, 동그란 코, 동그란 볼! 우리 윤아는 동글동글 귀여움 덩어리야. 할머니는 이 볼을 콕 찔러 보고 싶어서 손가락이 근질근질했어.", "w": 434, "h": 707}, {"id": "p018", "image": "p018.jpg", "date": "2023-05-05", "group": "2023", "age": "태어난 지 40일", "caption": "할머니가 윤아 기저귀를 갈아 주는 중이야. 꼬물꼬물 움직이는 다리가 어찌나 귀여운지! 할머니는 이 일이 세상에서 제일 행복한 일이었단다. 뽀송뽀송!", "w": 960, "h": 1280}, {"id": "p019", "image": "p019.jpg", "date": "2023-05-05", "group": "2023", "age": "태어난 지 40일", "caption": "엄마 아빠 사이에 쏙! 하늘색 모자 쓴 윤아가 우리 집 공주님이야. 엄마 아빠 얼굴에 웃음이 가득하지? 그게 다 윤아 덕분이란다.", "w": 960, "h": 1280}, {"id": "p020", "image": "p020.jpg", "date": "2023-05-05", "group": "2023", "age": "태어난 지 40일", "caption": "응? 왜 날 쳐다봐요? 하는 표정이야. 이렇게 새침한 표정은 영화배우도 못 따라 해. 할머니는 이 사진 보고 한참을 웃었단다.", "w": 960, "h": 1280}, {"id": "p021", "image": "p021.jpg", "date": "2023-05-05", "group": "2023", "age": "태어난 지 40일", "caption": "태어난 지 40일! 엄마 아빠가 윤아 작은 손을 꼭 잡았어. 사랑이 손에서 손으로 전해지는 것 같지? 할머니 마음까지 따뜻해졌단다.", "w": 1280, "h": 960}, {"id": "p022", "image": "p022.jpg", "date": "2023-05-09", "group": "2023", "age": "태어난 지 44일", "caption": "푹신한 쿠션 위의 꼬마 공주님! 볼이 찹쌀떡처럼 말랑말랑해서 할머니가 한 입 앙~ 하고 싶었어. 걱정 마, 진짜로는 안 먹어!", "w": 720, "h": 1280}, {"id": "p023", "image": "p023.jpg", "date": "2023-05-09", "group": "2023", "age": "태어난 지 44일", "caption": "어깨 위에서 부엌 구경 중! 윤아 눈에는 냄비도 숟가락도 다 신기한 장난감이지? 할머니는 윤아의 그 눈빛이 제일 좋아.", "w": 960, "h": 1280}, {"id": "p024", "image": "p024.jpg", "date": "2023-05-10", "group": "2023", "age": "태어난 지 45일", "caption": "앙앙! 윤아가 울고 있어. 그런데 이상하지? 우는 얼굴까지 이렇게 귀여울 수가 있나! 울어도 예쁘면 반칙이야, 반칙!", "w": 804, "h": 1280}, {"id": "p025", "image": "p025.jpg", "date": "2023-05-12", "group": "2023", "age": "태어난 지 47일", "caption": "할아버지 할머니가 윤아를 안고 함박웃음! 윤아를 안으면 할머니는 키가 한 뼘 더 커지는 것 같아. 행복해서 둥실둥실 날아갈 것 같았단다.", "w": 960, "h": 1280}, {"id": "p026", "image": "p026.jpg", "date": "2023-05-16", "group": "2023", "age": "태어난 지 51일", "caption": "태어난 지 50일! 레이스 모자에 하늘색 원피스, 오늘의 패션왕은 바로 윤아! 입을 오~ 하고 벌린 모습이 '할머니 나 예뻐요?' 하는 것 같아. 그럼, 제일 예쁘지!", "w": 802, "h": 1129}, {"id": "p027", "image": "p027.jpg", "date": "2023-05-21", "group": "2023", "age": "태어난 지 56일", "caption": "꼬물꼬물 작은 발이 할머니 손바닥에 쏙! 이 작은 발로 나중에 뛰뛰 달려서 할머니한테 오겠지? 할머니는 그날을 꿈꾸면서 발가락에 뽀뽀했단다.", "w": 960, "h": 1280}, {"id": "p028", "image": "p028.jpg", "date": "2023-05-21", "group": "2023", "age": "태어난 지 56일", "caption": "아빠 어깨 위에서 오~ 하고 놀랐네. 윤아야, 무슨 비밀을 발견했니? 할머니한테만 살짝 알려 줄래?", "w": 604, "h": 1280}, {"id": "p029", "image": "p029.jpg", "date": "2023-05-24", "group": "2023", "age": "태어난 지 59일", "caption": "아이고 눈부셔! 윤아 미소 때문에 할머니 집 전구 값이 다 굳었네. 이 웃음 한 번 보려고 할머니는 하루 종일 까꿍 놀이를 했단다.", "w": 728, "h": 1280}, {"id": "p030", "image": "p030.jpg", "date": "2023-05-27", "group": "2023", "age": "태어난 지 62일", "caption": "태어난 지 60일! 꽃 원피스에 꽃 머리띠. 꽃밭에 나비들이 윤아 보고 '꽃인 줄 알았네!' 했대. 꽃보다 윤아가 더 예뻐!", "w": 960, "h": 1280}, {"id": "p031", "image": "p031.jpg", "date": "2023-06-04", "group": "2023", "age": "태어난 지 70일", "caption": "하하하! 윤아가 웃으니까 할머니도 웃고, 할아버지도 웃고, 온 세상이 같이 웃어. 우리 윤아는 웃음 바이러스 박사님이야!", "w": 960, "h": 1280}, {"id": "p032", "image": "p032.jpg", "date": "2023-06-04", "group": "2023", "age": "태어난 지 70일", "caption": "할아버지 볼에 기대서 새침하게 한 컷! 모델 포즈는 어디서 배웠어? 할머니는 이 사진을 지갑에 넣고 다니면서 자랑했단다.", "w": 960, "h": 1280}, {"id": "p033", "image": "p033.jpg", "date": "2023-06-14", "group": "2023", "age": "태어난 지 80일", "caption": "태어난 지 80일! 토끼 친구를 또 만났네. 그동안 윤아가 훌쩍 컸지? 할머니는 윤아가 쑥쑥 크는 게 신기하고 대견해서 매일 사진을 기다렸어.", "w": 853, "h": 1280}, {"id": "p034", "image": "p034.jpg", "date": "2023-06-20", "group": "2023", "age": "태어난 지 86일", "caption": "엄마랑 같이 책 읽는 시간! 윤아가 책을 뚫어지게 보고 있어. 할머니는 생각했지. '우리 윤아는 책 좋아하는 꼬마 박사님이 되겠구나!'", "w": 853, "h": 1280}, {"id": "p035", "image": "p035.jpg", "date": "2023-06-24", "group": "2023", "age": "태어난 지 90일", "caption": "할아버지 무릎은 윤아 전용 의자야. 의젓하게 앉아 있는 모습 좀 봐! 할머니 눈에는 회장님보다 더 멋져 보였단다.", "w": 960, "h": 1280}, {"id": "p036", "image": "p036.jpg", "date": "2023-06-25", "group": "2023", "age": "태어난 지 91일", "caption": "태어난 지 90일! 분홍 발레복 입고 활짝! 발레리나 윤아가 무대에 섰어요. 할머니는 맨 앞자리에서 박수를 짝짝짝, 손바닥이 빨개지도록 쳤단다.", "w": 811, "h": 1082}, {"id": "p037", "image": "p037.jpg", "date": "2023-07-01", "group": "2023", "age": "태어난 지 97일", "caption": "한복 입은 우리 윤아! 노란 치마에 보라색 모자, 옛날 이야기 속 공주님이 나타났어. 할머니는 너무 고와서 넋을 놓고 바라봤단다.", "w": 887, "h": 1280}, {"id": "p038", "image": "p038.jpg", "date": "2023-07-02", "group": "2023", "age": "태어난 지 98일", "caption": "백일 잔치에 온 가족이 모였어! 풍선도 반짝, 윤아 얼굴도 반짝. 할머니는 그날 너무 행복해서 잠이 안 왔단다. 윤아야, 태어나 줘서 고마워.", "w": 1280, "h": 960}, {"id": "p039", "image": "p039.jpg", "date": "2023-07-02", "group": "2023", "age": "태어난 지 98일", "caption": "오! 입을 동그랗게 ~, 히~, 아~, 하하! 윤아는 표정이 몇 개야? 할머니는 네 장 다 갖고 싶어서 액자를 네 개나 샀단다.", "w": 1280, "h": 1280}, {"id": "p050", "image": "p050.jpg", "date": "2023-08-11", "group": "2023", "age": "태어난 지 138일", "caption": "초록 잔디밭에서 온 가족 찰칵! 분홍 옷 입은 윤아가 제일 눈에 띄지? 할머니는 이 사진 속 윤아만 콕 집어서 보고 또 봤어.", "w": 960, "h": 1280}, {"id": "p051", "image": "p051.jpg", "date": "2023-08-12", "group": "2023", "age": "태어난 지 139일", "caption": "할아버지랑 셀카! 할아버지 입이 귀에 걸렸네. 윤아랑 있으면 할아버지는 항상 이렇게 웃어. 할머니는 그 모습에 덩달아 웃었단다.", "w": 960, "h": 1280}, {"id": "p052", "image": "p052.jpg", "date": "2023-08-12", "group": "2023", "age": "태어난 지 139일", "caption": "할아버지랑 또 셀카! 하늘도 파랗고 윤아 볼도 빵빵. 오늘 날씨도 최고, 윤아 기분도 최고, 할머니 기분은 최고의 최고!", "w": 960, "h": 1280}, {"id": "p053", "image": "p053.jpg", "date": "2023-08-12", "group": "2023", "age": "태어난 지 139일", "caption": "엄마 아빠랑 숲속 나들이! 윤아가 깔깔 웃으니까 나무 위의 새들도 같이 노래했대. 할머니 귀에도 그 웃음소리가 들리는 것 같아.", "w": 1280, "h": 960}, {"id": "p054", "image": "p054.jpg", "date": "2023-08-16", "group": "2023", "age": "태어난 지 143일", "caption": "슝~! 슈퍼맨처럼 하늘 높이 날아라! 윤아는 날아다니는 슈퍼 아기야. 할머니는 무서울까 봐 조마조마, 그래도 윤아는 씩씩했지!", "w": 960, "h": 1280}, {"id": "p055", "image": "p055.jpg", "date": "2023-08-29", "group": "2023", "age": "태어난 지 156일", "caption": "까만 머리띠 하고 하하하! 할아버지 손을 꼭 잡고 웃는 윤아. 이 웃음소리가 할머니한테는 세상에서 제일 좋은 노래란다.", "w": 1027, "h": 1280}, {"id": "p056", "image": "p056.jpg", "date": "2023-09-05", "group": "2023", "age": "태어난 지 163일", "caption": "엎드려서 할머니를 빤히 쳐다보네. 윤아야, 그렇게 쳐다보면 할머니 녹아 버려! 할머니는 이 눈빛에 항상 지고 만단다.", "w": 720, "h": 1280}, {"id": "p057", "image": "p057.jpg", "date": "2023-09-15", "group": "2023", "age": "태어난 지 173일", "caption": "장난감 앞에서 씨익! 윤아는 벌써 장난감 박사님이야. 할머니가 사 준 장난감도 이렇게 좋아해 주면 좋겠다!", "w": 1280, "h": 958}, {"id": "p058", "image": "p058.jpg", "date": "2023-09-28", "group": "2023", "age": "태어난 지 186일", "caption": "범보 의자에 앉은 윤아랑 할아버지. 둘이 무슨 이야기를 할까? 할머니는 궁금해서 귀를 쫑긋했지. 아마 '할머니 예뻐요' 했겠지?", "w": 960, "h": 1280}, {"id": "p059", "image": "p059.jpg", "date": "2023-10-07", "group": "2023", "age": "태어난 지 195일", "caption": <script>
(() => {
"use strict";
const ALBUM = JSON.parse(document.getElementById("album").textContent);
const GROUPS = [...new Set(ALBUM.map(p => p.group))];
const $ = id => document.getElementById(id);
const track = $("track"), bubble = $("bubble"), counter = $("counter");

/* ---------- shared voice data (published files) ---------- */
let data = { voices: {}, captions: {} };      // voices[id] = {path,type}; captions[id] = text
const localUrl = {};                           // id -> blob: URL for recordings made in this view
fetch("data/voices.json?ts=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : null).then(j => { if (j) { data = { voices: j.voices || {}, captions: j.captions || {} }; render(); } })
  .catch(() => {});
const captionOf = p => data.captions[p.id] || p.caption;
const hasVoice = p => !!(localUrl[p.id] || data.voices[p.id]);

/* ---------- Audio controller: one voice at a time ---------- */
const Audio1 = (() => {
  const el = new Audio(); el.preload = "auto";
  let onEnd = null, koVoice = null;
  const pickVoice = () => { const v = speechSynthesis.getVoices(); koVoice = v.find(x => /ko[-_]KR/i.test(x.lang)) || v.find(x => /^ko/i.test(x.lang)) || null; };
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  el.addEventListener("ended", () => onEnd && onEnd());
  el.addEventListener("error", () => onEnd && onEnd());
  function stop() {
    try { el.pause(); el.currentTime = 0; } catch (e) {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    const f = onEnd; onEnd = null; f && f();
  }
  function play(p, done) {
    stop(); onEnd = done;
    const src = localUrl[p.id] || (data.voices[p.id] && data.voices[p.id].path);
    if (src) { el.src = src; el.play().catch(() => speak(captionOf(p))); return; }
    speak(captionOf(p));
  }
  function speak(text) {
    if (!("speechSynthesis" in window)) { setTimeout(() => onEnd && onEnd(), 2500); return; }
    const u = new SpeechSynthesisUtterance(text.replace(/[!?~]/g, m => m === "~" ? "" : m));
    u.lang = "ko-KR"; if (koVoice) u.voice = koVoice; u.rate = 0.92; u.pitch = 1.15;
    u.onend = u.onerror = () => onEnd && onEnd();
    speechSynthesis.speak(u);
  }
  return { play, stop };
})();

/* ---------- caption with Korean word chips ---------- */
const KW = /(반짝반짝|예쁘[다네지]|예뻐[!요]?|귀여[운워움]|천재|공주님|사랑|말랑말랑|동글동글|뽀송뽀송|최고|할머니|할아버지|엄마|아빠)/g;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function showCaption(p) {
  bubble.innerHTML = '<span class="who">할머니가 말해요' + (hasVoice(p) ? " · 목소리" : "") + "</span>" + esc(captionOf(p)).replace(KW, '<span class="kw">$1</span>');
  bubble.classList.toggle("long", captionOf(p).length > 60);
  bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
}

/* ---------- tabs + slides ---------- */
let group = GROUPS.includes("2023") ? "2023" : GROUPS[0];
try { const g = localStorage.getItem("yoona.tab"); if (GROUPS.includes(g)) group = g; } catch (e) {}
let list = [], idx = 0, playingCard = null;
const label = g => g === "뱃속" ? "뱃속" : g + "년";

function renderTabs() {
  $("tabs").innerHTML = GROUPS.map(g => `<button class="tab" role="tab" type="button" data-g="${esc(g)}" aria-selected="${g === group}">${label(g)}</button>`).join("");
}
function render() {
  list = ALBUM.filter(p => p.group === group);
  track.innerHTML = list.map((p, i) => `
    <div class="slide"><div class="card" data-i="${i}" role="button" aria-label="${esc(p.age)} 사진, 누르면 할머니 목소리">
      <img src="photos/${p.image}" alt="${esc(p.age)} 윤아" ${i < 2 ? "" : 'loading="lazy"'} decoding="async" draggable="false">
      <span class="age">${esc(p.age)}</span>${hasVoice(p) ? '<span class="mic">할머니 목소리</span>' : ""}
      ${i === 0 ? '<span class="tap">콕! 눌러 봐</span>' : ""}
    </div></div>`).join("");
  idx = Math.min(idx, list.length - 1);
  track.scrollLeft = idx * track.clientWidth;
  updateCounter();
}
function updateCounter() {
  counter.textContent = `${label(group)} · ${idx + 1} / ${list.length}`;
  $("prev").disabled = idx <= 0; $("next").disabled = idx >= list.length - 1;
}
function go(i) { idx = Math.max(0, Math.min(list.length - 1, i)); track.scrollTo({ left: idx * track.clientWidth, behavior: "smooth" }); updateCounter(); }

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b || b.dataset.g === group) return;
  Audio1.stop(); group = b.dataset.g; idx = 0;
  try { localStorage.setItem("yoona.tab", group); } catch (e) {}
  renderTabs(); render(); resetBubble(); closeEdit();
});
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);

let st;
track.addEventListener("scroll", () => {
  clearTimeout(st);
  st = setTimeout(() => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== idx) { idx = i; Audio1.stop(); resetBubble(); closeEdit(); updateCounter(); }
  }, 90);
}, { passive: true });
addEventListener("resize", () => { track.scrollLeft = idx * track.clientWidth; });

track.addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const i = +card.dataset.i; idx = i; updateCounter();
  const p = list[i];
  const tip = card.querySelector(".tap"); if (tip) tip.remove();
  showCaption(p);
  if (playingCard) playingCard.classList.remove("playing");
  playingCard = card; card.classList.remove("playing"); void card.offsetWidth; card.classList.add("playing");
  Audio1.play(p, () => { card.classList.remove("playing"); if (playingCard === card) playingCard = null; });
});
function resetBubble() {
  bubble.innerHTML = '<span class="hint">사진을 콕! 누르면 할머니가 말해 줘요</span>';
  if (playingCard) { playingCard.classList.remove("playing"); playingCard = null; }
}

/* ---------- Grandma mode (long-press so the toddler can't open it) ---------- */
let gmOn = false, pressT;
const gmBtn = $("gm");
const setGm = on => { gmOn = on; gmBtn.classList.toggle("on", on); gmBtn.textContent = on ? "할머니 모드 끝" : "할머니"; $("tools").hidden = !on; status(on ? "사진을 넘기고 녹음하기를 누르세요. 저장하면 모두에게 보여요." : ""); closeEdit(); };
let justOpened = false;
gmBtn.addEventListener("pointerdown", () => { if (gmOn) return; gmBtn.textContent = "꾹…"; pressT = setTimeout(() => { justOpened = true; setGm(true); }, 1200); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => gmBtn.addEventListener(ev, () => { clearTimeout(pressT); if (!gmOn) gmBtn.textContent = "할머니"; }));
gmBtn.addEventListener("contextmenu", e => e.preventDefault());
gmBtn.addEventListener("click", e => {
  if (e.detail === 0) { setGm(!gmOn); return; }          // keyboard
  if (justOpened) { justOpened = false; return; }
  if (gmOn) setGm(false);
});
function status(t) { $("status").textContent = t; }

let artifactNs = null, readOnly = false;
const artP = (window.claude && window.claude.use) ? window.claude.use("artifact").then(a => (artifactNs = a)).catch(() => null) : Promise.resolve(null);

async function save(files, okMsg) {
  await artP;
  if (!artifactNs || readOnly) { status("이 화면에서는 저장할 수 없어요 (보기 전용). 단장님 계정의 링크에서 저장해 주세요."); return false; }
  status("저장 중…");
  try { await artifactNs.publish(files); status(okMsg); return true; }
  catch (e) {
    const c = e && e.code;
    if (["not_writer", "not_granted", "capability_disabled", "consent_required", "capability_removed", "not_declared"].includes(c)) { readOnly = true; status("보기 전용 링크라서 저장할 수 없어요."); }
    else if (c === "conflict") status("다른 곳에서 먼저 저장되어 새로 고칩니다. 다시 해 주세요.");
    else if (c === "too_large") status("파일이 너무 커요. 30초 이내로 녹음해 주세요.");
    else if (c === "rate_limited") status("잠시 후 다시 저장해 주세요.");
    else status("저장하지 못했어요. 잠시 후 다시 해 주세요.");
    return false;
  }
}
const voicesFile = () => ({ content: JSON.stringify(data, null, 1), contentType: "application/json" });

async function storeVoice(blob) {
  const p = list[idx]; if (!p) return;
  if (blob.size > 6 * 1024 * 1024) { status("파일이 너무 커요. 30초 이내로 해 주세요."); return; }
  const t = (blob.type || "").split(";")[0] || "audio/mpeg";
  const ext = /mp4|m4a|aac/.test(t) ? "mp4" : /webm/.test(t) ? "webm" : /ogg/.test(t) ? "ogg" : /wav/.test(t) ? "wav" : "mp3";
  const path = `voices/${p.id}-${Date.now()}.${ext}`;
  const prev = data.voices[p.id];
  localUrl[p.id] = URL.createObjectURL(blob);
  data.voices[p.id] = { path, type: t };
  const files = { [path]: { content: blob, contentType: ext === "mp4" ? "audio/mp4" : t }, "data/voices.json": voicesFile() };
  if (prev && prev.path) files[prev.path] = null;
  const ok = await save(files, "저장했어요! 사진을 눌러 들어 보세요.");
  if (!ok) status($("status").textContent + " (지금 이 폰에서는 들어볼 수 있어요)");
  render(); go(idx);
}

/* recording: microphone if the viewer allows it, otherwise the phone's own recorder via file picker */
let rec = null, chunks = [], recStop;
$("recBtn").onclick = async () => {
  if (rec) { rec.stop(); return; }
  Audio1.stop();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) {
    if (matchMedia("(pointer:coarse)").matches) { status("이 화면에서 마이크를 쓸 수 없어 휴대폰 녹음기를 엽니다."); $("fileIn").click(); }
    else status("PC에서는 '윤아 녹음 도우미' 파일로 녹음한 뒤, [녹음 한꺼번에 넣기]로 ZIP을 넣어 주세요.");
    return;
  }
  const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { clearTimeout(recStop); stream.getTracks().forEach(t => t.stop()); const b = new Blob(chunks, { type: rec.mimeType || mime || "audio/webm" }); rec = null; $("recBtn").textContent = "● 녹음하기"; storeVoice(b); };
  rec.start(); $("recBtn").textContent = "■ 녹음 끝내기"; status("녹음 중… 자막을 읽어 주세요 (최대 30초)");
  showCaption(list[idx]);
  recStop = setTimeout(() => rec && rec.stop(), 30000);
};
$("fileBtn").onclick = () => $("fileIn").click();
$("fileIn").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) storeVoice(f); };

/* bulk import: files named pNNN.* (or a ZIP of them) are matched to photos by number */
async function unzip(file) {
  const buf = await file.arrayBuffer(), dv = new DataView(buf), out = [];
  let e = buf.byteLength - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) return out;
  let n = dv.getUint16(e + 10, true), o = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  while (n-- > 0 && dv.getUint32(o, true) === 0x02014b50) {
    const m = dv.getUint16(o + 10, true), cs = dv.getUint32(o + 20, true), nl = dv.getUint16(o + 28, true), xl = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true);
    const name = dec.decode(new Uint8Array(buf, o + 46, nl)); o += 46 + nl + xl + cl;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    let bytes = new Uint8Array(buf, ds, cs);
    if (m === 8) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else if (m !== 0) continue;
    const ext = (name.split(".").pop() || "").toLowerCase();
    out.push(new File([bytes], name.split("/").pop(), { type: ext === "m4a" ? "audio/mp4" : ext === "wav" ? "audio/wav" : "audio/mpeg" }));
  }
  return out;
}
$("bulkBtn").onclick = () => $("bulkIn").click();
$("bulkIn").onchange = async e => {
  const picked = [...e.target.files]; e.target.value = "";
  let files = [];
  for (const f of picked) { if (/\.zip$/i.test(f.name)) { try { files.push(...await unzip(f)); } catch (_) {} } else files.push(f); }
  const byId = {}, skipped = [];
  for (const f of files) {
    const m = f.name.match(/p(\d{3})/i) || f.name.match(/^(\d{1,3})\D/);
    const id = m ? "p" + String(+m[1]).padStart(3, "0") : null;
    if (id && ALBUM.some(a => a.id === id) && f.size <= 6 * 1024 * 1024) byId[id] = f; else skipped.push(f.name);
  }
  const ids = Object.keys(byId).sort();
  if (!ids.length) { status("연결할 파일이 없어요. 파일 이름이 p001.mp3 처럼 번호로 시작해야 해요."); return; }
  Audio1.stop(); let done = 0, failed = false;
  for (let i = 0; i < ids.length && !failed; i += 10) {
    const batch = ids.slice(i, i + 10), files2 = {}, prevs = {}, urls = {};
    for (const id of batch) {
      const f = byId[id], t = f.type || "audio/mpeg";
      const ext = /mp4|m4a|aac/.test(t) ? "mp4" : /webm/.test(t) ? "webm" : /ogg/.test(t) ? "ogg" : /wav/.test(t) ? "wav" : "mp3";
      const path = `voices/${id}-${Date.now()}.${ext}`;
      prevs[id] = data.voices[id]; urls[id] = URL.createObjectURL(f);
      files2[path] = { content: f, contentType: ext === "mp4" ? "audio/mp4" : t };
      data.voices[id] = { path, type: t };
      if (prevs[id] && prevs[id].path) files2[prevs[id].path] = null;
    }
    files2["data/voices.json"] = voicesFile();
    Object.assign(localUrl, urls);
    if (await save(files2, "")) { done += batch.length; status(`연결 중… ${done} / ${ids.length}`); }
    else { failed = true; }
  }
  render(); go(idx);
  status(failed ? `${done}개만 저장됐어요. 다시 한 번 넣어 주세요. (이 화면에서는 ${ids.length}개 모두 들을 수 있어요)` : `${ids.length}개를 사진에 연결했어요!` + (skipped.length ? ` (번호를 못 찾은 파일 ${skipped.length}개 제외)` : ""));
};
$("delBtn").onclick = async () => {
  const p = list[idx]; if (!p || !hasVoice(p)) { status("이 사진에는 녹음이 없어요."); return; }
  const prev = data.voices[p.id]; delete data.voices[p.id]; delete localUrl[p.id];
  const files = { "data/voices.json": voicesFile() }; if (prev && prev.path) files[prev.path] = null;
  await save(files, "녹음을 지웠어요. 이제 기계 목소리로 읽어 줘요."); render(); go(idx);
};

/* caption editing */
function closeEdit() { $("editWrap").hidden = true; }
$("editBtn").onclick = () => { $("editTxt").value = captionOf(list[idx]); $("editWrap").hidden = false; $("editTxt").focus(); };
$("editCancel").onclick = closeEdit;
$("editSave").onclick = async () => {
  const p = list[idx], v = $("editTxt").value.trim(); if (!v) return;
  if (v === p.caption) delete data.captions[p.id]; else data.captions[p.id] = v;
  closeEdit(); showCaption(p);
  await save({ "data/voices.json": voicesFile() }, "자막을 저장했어요.");
};

renderTabs(); render();
})();
</script>
</body></html>
